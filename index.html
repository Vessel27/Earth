<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Earth's Interior – Interactive 3D Model</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600&display=swap');

  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --crust:     #8B9E7A;
    --mantle:    #C4783A;
    --outercore: #E8A020;
    --innercore: #FFD700;
    --bg:        #030510;
    --panel:     rgba(8,14,35,0.90);
    --accent:    #4FC3F7;
    --text:      #E0EAF8;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Rajdhani', sans-serif;
    height: 100vh;
    width: 100vw;
    overflow: hidden;
  }

  /* ── Stars ── */
  #stars {
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background:
      radial-gradient(1px 1px at 10% 20%, rgba(255,255,255,.8) 0%, transparent 100%),
      radial-gradient(1px 1px at 30% 80%, rgba(255,255,255,.6) 0%, transparent 100%),
      radial-gradient(1px 1px at 60% 10%, rgba(255,255,255,.7) 0%, transparent 100%),
      radial-gradient(1px 1px at 80% 60%, rgba(255,255,255,.5) 0%, transparent 100%),
      radial-gradient(2px 2px at 90% 30%, rgba(200,220,255,.6) 0%, transparent 100%),
      radial-gradient(2px 2px at 15% 70%, rgba(200,220,255,.5) 0%, transparent 100%);
  }

  /* ── Header ── */
  #header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 20;
    padding: 16px 32px;
    display: flex; align-items: center; justify-content: space-between;
    background: linear-gradient(to bottom, rgba(3,5,16,.97) 60%, transparent);
    pointer-events: none;
  }
  #header h1 {
    font-family: 'Orbitron', sans-serif;
    font-size: 1.3rem; font-weight: 900; letter-spacing: .12em;
    color: #fff; text-shadow: 0 0 20px var(--accent);
  }
  #header .sub {
    font-size: .72rem; font-weight: 300; color: var(--accent);
    letter-spacing: .3em; text-transform: uppercase; margin-top: 2px;
  }

  /* ── Sketchfab embed ── */
  #embed-wrap {
    position: fixed; inset: 0; z-index: 1;
  }
  #embed-wrap iframe {
    width: 100%; height: 100%; border: none;
  }

  /* ── Layer info buttons (left side) ── */
  #layer-btns {
    position: fixed; left: 24px; top: 50%;
    transform: translateY(-50%);
    z-index: 20;
    display: flex; flex-direction: column; gap: 10px;
  }

  .lbtn {
    position: relative;
    display: flex; align-items: center; gap: 12px;
    background: var(--panel);
    border: 1px solid rgba(79,195,247,.25);
    border-radius: 12px;
    padding: 11px 16px 11px 14px;
    cursor: pointer;
    min-width: 180px;
    backdrop-filter: blur(12px);
    transition: border-color .25s, box-shadow .25s, transform .15s;
    text-align: left;
  }
  .lbtn:hover { transform: translateX(4px); box-shadow: 0 0 18px rgba(79,195,247,.15); }

  .lbtn-dot {
    width: 13px; height: 13px; border-radius: 50%; flex-shrink: 0;
  }
  .lbtn-text { flex: 1; }
  .lbtn-name {
    font-family: 'Orbitron', sans-serif;
    font-size: .65rem; font-weight: 700; letter-spacing: .1em;
    text-transform: uppercase; color: #fff;
  }
  .lbtn-depth {
    font-size: .68rem; font-weight: 300;
    color: rgba(224,234,248,.55); margin-top: 1px;
  }
  .lbtn-info {
    width: 20px; height: 20px; border-radius: 50%;
    background: rgba(79,195,247,.15);
    border: 1px solid rgba(79,195,247,.4);
    color: var(--accent);
    font-size: .65rem; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; transition: background .2s;
  }
  .lbtn:hover .lbtn-info { background: rgba(79,195,247,.35); }

  /* layer colors */
  .lbtn[data-layer="crust"]     { border-color: rgba(139,158,122,.4); }
  .lbtn[data-layer="crust"]:hover { border-color: var(--crust); }
  .lbtn[data-layer="mantle"]    { border-color: rgba(196,120,58,.4); }
  .lbtn[data-layer="mantle"]:hover { border-color: var(--mantle); }
  .lbtn[data-layer="outercore"] { border-color: rgba(232,160,32,.4); }
  .lbtn[data-layer="outercore"]:hover { border-color: var(--outercore); }
  .lbtn[data-layer="innercore"] { border-color: rgba(255,215,0,.4); }
  .lbtn[data-layer="innercore"]:hover { border-color: var(--innercore); }

  /* ── Modal overlay ── */
  #modal-overlay {
    position: fixed; inset: 0; z-index: 100;
    background: rgba(0,0,0,.65);
    backdrop-filter: blur(6px);
    display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none;
    transition: opacity .3s;
  }
  #modal-overlay.open { opacity: 1; pointer-events: all; }

  #modal {
    background: rgba(6,12,30,.97);
    border: 1px solid rgba(79,195,247,.25);
    border-radius: 18px;
    padding: 36px 32px 28px;
    width: min(520px, 92vw);
    max-height: 85vh;
    overflow-y: auto;
    position: relative;
    transform: translateY(20px) scale(.97);
    transition: transform .3s;
    box-shadow: 0 0 60px rgba(0,0,0,.6);
  }
  #modal-overlay.open #modal { transform: translateY(0) scale(1); }

  #modal-close {
    position: absolute; top: 16px; right: 18px;
    background: rgba(79,195,247,.1);
    border: 1px solid rgba(79,195,247,.3);
    color: var(--accent); border-radius: 50%;
    width: 32px; height: 32px;
    font-size: 1rem; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background .2s;
  }
  #modal-close:hover { background: rgba(79,195,247,.3); }

  .modal-badge {
    display: inline-block;
    font-family: 'Orbitron', sans-serif;
    font-size: .6rem; letter-spacing: .25em; text-transform: uppercase;
    padding: 4px 12px; border-radius: 20px;
    margin-bottom: 12px;
    border: 1px solid currentColor;
  }
  .modal-title {
    font-family: 'Orbitron', sans-serif;
    font-size: 1.6rem; font-weight: 900;
    margin-bottom: 4px;
  }
  .modal-depth {
    font-size: .82rem; color: rgba(224,234,248,.5);
    letter-spacing: .06em; margin-bottom: 20px;
    padding-bottom: 18px;
    border-bottom: 1px solid rgba(79,195,247,.12);
  }
  .modal-desc {
    font-size: .95rem; line-height: 1.7;
    color: rgba(224,234,248,.88); margin-bottom: 22px;
  }
  .modal-stats {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 10px; margin-bottom: 20px;
  }
  .stat-card {
    background: rgba(79,195,247,.06);
    border: 1px solid rgba(79,195,247,.12);
    border-radius: 10px; padding: 12px 14px;
  }
  .stat-card .sk {
    font-size: .68rem; letter-spacing: .1em; text-transform: uppercase;
    color: rgba(224,234,248,.45); margin-bottom: 4px;
  }
  .stat-card .sv {
    font-family: 'Orbitron', sans-serif;
    font-size: .85rem; font-weight: 700;
  }
  .modal-facts { margin-top: 4px; }
  .modal-facts h4 {
    font-family: 'Orbitron', sans-serif;
    font-size: .65rem; letter-spacing: .2em; text-transform: uppercase;
    color: var(--accent); margin-bottom: 10px;
  }
  .modal-facts ul {
    list-style: none; display: flex; flex-direction: column; gap: 7px;
  }
  .modal-facts li {
    font-size: .88rem; line-height: 1.5;
    color: rgba(224,234,248,.8);
    padding-left: 16px; position: relative;
  }
  .modal-facts li::before {
    content: '›'; position: absolute; left: 0;
    color: var(--accent); font-weight: 700;
  }

  /* ── Bottom hint ── */
  #hint {
    position: fixed; bottom: 22px; left: 50%;
    transform: translateX(-50%);
    z-index: 20;
    background: var(--panel);
    border: 1px solid rgba(79,195,247,.18);
    border-radius: 30px;
    padding: 8px 22px;
    font-family: 'Orbitron', sans-serif;
    font-size: .58rem; letter-spacing: .15em; text-transform: uppercase;
    color: rgba(79,195,247,.7);
    backdrop-filter: blur(10px);
    pointer-events: none;
  }
</style>
</head>
<body>

<div id="stars"></div>

<!-- Header -->
<div id="header">
  <div>
    <h1>EARTH'S INTERIOR</h1>
    <div class="sub">Interactive 3D Geological Model</div>
  </div>
</div>

<!-- Sketchfab embed -->
<div id="embed-wrap">
  <iframe
    title="Earth's Interior"
    src="https://sketchfab.com/models/4fa1ee1a6fa246d8acf56bc400f1bf5f/embed?autostart=1&ui_theme=dark&ui_infos=0&ui_watermark=0&ui_ar=0&ui_help=0&ui_settings=0&ui_inspector=0&ui_annotations=0&ui_stop=0&preload=1"
    allow="autoplay; fullscreen; xr-spatial-tracking"
    allowfullscreen
  ></iframe>
</div>

<!-- Layer info buttons -->
<div id="layer-btns">
  <button class="lbtn" data-layer="crust" onclick="openModal('crust')">
    <div class="lbtn-dot" style="background:#8B9E7A;box-shadow:0 0 8px #8B9E7A"></div>
    <div class="lbtn-text">
      <div class="lbtn-name">Crust</div>
      <div class="lbtn-depth">0 – 70 km</div>
    </div>
    <div class="lbtn-info">i</div>
  </button>

  <button class="lbtn" data-layer="mantle" onclick="openModal('mantle')">
    <div class="lbtn-dot" style="background:#C4783A;box-shadow:0 0 8px #C4783A"></div>
    <div class="lbtn-text">
      <div class="lbtn-name">Mantle</div>
      <div class="lbtn-depth">70 – 2,900 km</div>
    </div>
    <div class="lbtn-info">i</div>
  </button>

  <button class="lbtn" data-layer="outercore" onclick="openModal('outercore')">
    <div class="lbtn-dot" style="background:#E8A020;box-shadow:0 0 8px #E8A020"></div>
    <div class="lbtn-text">
      <div class="lbtn-name">Outer Core</div>
      <div class="lbtn-depth">2,900 – 5,150 km</div>
    </div>
    <div class="lbtn-info">i</div>
  </button>

  <button class="lbtn" data-layer="innercore" onclick="openModal('innercore')">
    <div class="lbtn-dot" style="background:#FFD700;box-shadow:0 0 10px #FFD700"></div>
    <div class="lbtn-text">
      <div class="lbtn-name">Inner Core</div>
      <div class="lbtn-depth">5,150 – 6,371 km</div>
    </div>
    <div class="lbtn-info">i</div>
  </button>
</div>

<!-- Modal -->
<div id="modal-overlay" onclick="handleOverlayClick(event)">
  <div id="modal">
    <button id="modal-close" onclick="closeModal()">✕</button>
    <div class="modal-badge" id="modal-badge"></div>
    <div class="modal-title" id="modal-title"></div>
    <div class="modal-depth" id="modal-depth"></div>
    <div class="modal-desc" id="modal-desc"></div>
    <div class="modal-stats" id="modal-stats"></div>
    <div class="modal-facts">
      <h4>Key Facts</h4>
      <ul id="modal-facts"></ul>
    </div>
  </div>
</div>

<!-- Bottom hint -->
<div id="hint">🖱 Drag to rotate &nbsp;·&nbsp; Scroll to zoom &nbsp;·&nbsp; Click ⓘ for layer info</div>

<script>
const DATA = {
  crust: {
    color: '#8B9E7A',
    title: 'The Crust',
    depth: '0 – 70 km depth',
    desc: 'The crust is Earth\'s outermost solid shell, divided into oceanic and continental types. Oceanic crust is thin (~7 km), dense, and composed mainly of basalt. Continental crust is thicker (~35–70 km) and less dense, made largely of granite and sedimentary rocks.',
    stats: [
      { k: 'Thickness', v: '7 – 70 km' },
      { k: 'Temp. Range', v: '0 – 900 °C' },
      { k: 'Composition', v: 'Silicate rock' },
      { k: 'State', v: 'Solid' },
    ],
    facts: [
      'Makes up less than 1% of Earth\'s total volume.',
      'Divided into tectonic plates that move a few centimetres per year.',
      'Oceanic crust is continuously created at mid-ocean ridges.',
      'The deepest borehole ever drilled reached only 12 km into the crust.',
    ]
  },
  mantle: {
    color: '#C4783A',
    title: 'The Mantle',
    depth: '70 – 2,900 km depth',
    desc: 'The mantle is the thickest layer, making up about 84% of Earth\'s volume. Although solid rock, it behaves plastically over geological timescales, flowing in slow convection currents that drive plate tectonics. It is rich in iron and magnesium silicate minerals.',
    stats: [
      { k: 'Thickness', v: '~2,830 km' },
      { k: 'Temp. Range', v: '900 – 3,700 °C' },
      { k: 'Composition', v: 'Peridotite' },
      { k: 'State', v: 'Solid (plastic)' },
    ],
    facts: [
      'Convection currents in the mantle are the engine behind plate tectonics.',
      'The upper mantle includes the asthenosphere, a partially molten zone.',
      'Mantle plumes can punch through to create hotspot volcanoes like Hawaii.',
      'Seismic waves change speed at the mantle–core boundary (Gutenberg discontinuity).',
    ]
  },
  outercore: {
    color: '#E8A020',
    title: 'Outer Core',
    depth: '2,900 – 5,150 km depth',
    desc: 'The outer core is a liquid layer of iron and nickel alloy. Convective motion within it, combined with Earth\'s rotation, generates our planet\'s magnetic field through a dynamo effect — the invisible shield that deflects harmful solar wind particles.',
    stats: [
      { k: 'Thickness', v: '~2,250 km' },
      { k: 'Temp. Range', v: '3,700 – 5,000 °C' },
      { k: 'Composition', v: 'Liquid Fe-Ni' },
      { k: 'State', v: 'Liquid' },
    ],
    facts: [
      'The only liquid layer inside Earth.',
      'Responsible for generating Earth\'s magnetosphere.',
      'Without it, solar wind would strip away our atmosphere.',
      'Flows at speeds of roughly 20 km per year.',
    ]
  },
  innercore: {
    color: '#FFD700',
    title: 'Inner Core',
    depth: '5,150 – 6,371 km depth',
    desc: 'Despite temperatures comparable to the Sun\'s surface, the inner core is solid due to the immense pressure at Earth\'s centre. It is primarily iron with traces of nickel and lighter elements, and rotates slightly faster than the rest of the planet.',
    stats: [
      { k: 'Radius', v: '~1,220 km' },
      { k: 'Temperature', v: '~5,200 °C' },
      { k: 'Composition', v: 'Solid Fe-Ni' },
      { k: 'State', v: 'Solid' },
    ],
    facts: [
      'Pressure exceeds 3.5 million atmospheres, keeping iron solid.',
      'Rotates about 0.3–0.5° per year faster than Earth\'s surface.',
      'Has a crystalline structure aligned with Earth\'s rotation axis.',
      'Discovered in 1936 by seismologist Inge Lehmann.',
    ]
  }
};

function openModal(layer) {
  const d = DATA[layer];
  document.getElementById('modal-badge').textContent = layer.replace('outercore','Outer Core').replace('innercore','Inner Core');
  document.getElementById('modal-badge').style.color = d.color;
  document.getElementById('modal-badge').style.borderColor = d.color;
  document.getElementById('modal-title').textContent = d.title;
  document.getElementById('modal-title').style.color = d.color;
  document.getElementById('modal-depth').textContent = d.depth;
  document.getElementById('modal-desc').textContent = d.desc;

  document.getElementById('modal-stats').innerHTML = d.stats.map(s => `
    <div class="stat-card">
      <div class="sk">${s.k}</div>
      <div class="sv" style="color:${d.color}">${s.v}</div>
    </div>`).join('');

  document.getElementById('modal-facts').innerHTML = d.facts.map(f =>
    `<li>${f}</li>`).join('');

  document.getElementById('modal-overlay').classList.add('open');
}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('open');
}

function handleOverlayClick(e) {
  if (e.target === document.getElementById('modal-overlay')) closeModal();
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
</script>
</body>
</html>
